# @package _global_
defaults:
  - override /model: qwen_4b
  - override /hardware: a10_gpu

training:
  learning_rate: 2e-4
  max_steps: 1000
  batch_size: 4
  grad_accum: 2
  optimizer: "paged_adamw_32bit"
  logging_steps: 10
  save_steps: 20
  warmup_ratio: 0.1
  assistant_only_loss: true
  push_to_hub: true
  packing: true
  max_length: 8192